<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>SMS Portal</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f2747">
 <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block" rel="stylesheet">
</head>
<body>
  <!-- Splash shown until Angular boots; App keeps the same markup up until the first page is ready -->
  <app-root>
    <div class="app-loader" role="status" aria-label="Loading">
      <span class="app-loader__brand"><img src="assets/images/logo.png" alt=""></span>
      <span class="app-loader__spinner" aria-hidden="true"></span>
    </div>
  </app-root>
</body>
</html>
